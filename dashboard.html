<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="assets/images/logo1.png">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="min-h-screen bg-[#0A0F1C] text-slate-200 overflow-x-hidden selection:bg-indigo-500 selection:text-white">

    <!-- ========================================== -->
    <!-- พื้นหลัง(Abstract Background) -->
    <!-- ========================================== -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-indigo-600/10 rounded-full blur-[100px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[30rem] h-[30rem] bg-emerald-600/10 rounded-full blur-[120px]"></div>
    </div>

    <div id="state-dashboard" class="flex min-h-screen w-full flex-col md:flex-row fade-in relative z-10">
        
        <!-- ========================================== -->
        <!-- เมนูด้านซ้าย (Sidebar) -->
        <!-- ========================================== -->
        <div class="w-full md:w-72 bg-[#111827]/80 backdrop-blur-xl border-b md:border-b-0 md:border-r border-white/5 flex flex-col shrink-0 shadow-[4px_0_24px_rgba(0,0,0,0.4)]">
            
            <!-- ข้อมูลผู้ใช้ -->
            <div class="p-6 border-b border-white/5 bg-gradient-to-b from-white/5 to-transparent">
                <div class="flex items-center gap-4 mb-6 group cursor-default">
                    <div class="relative">
                        <div class="absolute inset-0 bg-indigo-500 blur-md opacity-40 group-hover:opacity-60 transition-opacity"></div>
                        <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center relative shadow-lg">
                            <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                        </div>
                    </div>
                    <div>
                        <div class="text-[11px] text-slate-400 uppercase tracking-wider font-semibold">เข้าสู่ระบบโดย</div>
                        <div class="text-base font-bold text-white tracking-wide" id="dash-username">กำลังโหลด...</div>
                    </div>
                </div>

                <!-- การ์ดสถานะ -->
                <div class="bg-[#0f172a]/80 backdrop-blur-sm rounded-2xl p-4 border border-white/10 shadow-inner relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-16 h-16 bg-emerald-500/10 rounded-bl-full blur-xl"></div>
                    <div class="flex items-center gap-2 mb-3">
                        <div class="relative flex h-2.5 w-2.5">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                        </div>
                        <span class="text-xs font-bold text-emerald-400 tracking-wide">สถานะ: ปกติ</span>
                    </div>
                    
                    <div class="space-y-2">
                        <div>
                            <div class="text-[10px] text-slate-400 uppercase tracking-wider">วันหมดอายุ</div>
                            <div class="text-xs font-mono text-slate-200" id="dash-expire-date">ตรวจสอบข้อมูล...</div>
                        </div>
                        <div>
                            <div class="text-[10px] text-slate-400 uppercase tracking-wider">เหลือเวลา</div>
                            <div class="text-sm font-bold font-mono text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.4)]" id="dash-countdown">คำนวณ...</div>
                        </div>
                    </div>
                </div>

                <button onclick="alert('ติดต่อผู้ดูแลระบบ เพื่อต่ออายุครับ')" class="w-full mt-4 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 hover:text-white text-xs font-semibold transition-all duration-300 flex items-center justify-center gap-2 group">
                    <svg class="w-4 h-4 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
                    ต่ออายุการใช้งาน
                </button>
            </div>

            <!-- ปุ่มเมนู -->
            <div class="p-4 space-y-3 flex-1 overflow-y-auto custom-scrollbar">
                
                <button id="btn-mode-premium" onclick="switchSystemMode('premium')" class="w-full flex items-center gap-4 py-3 px-4 rounded-xl transition-all duration-300 cursor-pointer border border-transparent group relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-r from-indigo-500/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="w-10 h-10 bg-white/10 backdrop-blur-md rounded-lg p-1 flex-shrink-0 shadow-lg border border-white/10 relative z-10 group-hover:bg-white/20 transition-colors">
                        <img src="assets/images/logopk.png" class="w-full h-full object-cover rounded-md group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <span class="text-slate-300 group-hover:text-white font-bold text-sm tracking-wide text-left relative z-10 transition-colors">PREMIUM KIDS</span>
                </button>

                <button id="btn-mode-document" onclick="switchSystemMode('document')" class="w-full flex items-center gap-4 py-3 px-4 rounded-xl transition-all duration-300 cursor-pointer border border-transparent group relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-r from-blue-500/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="w-10 h-10 bg-white/10 backdrop-blur-md rounded-lg p-1 flex-shrink-0 shadow-lg border border-white/10 relative z-10 group-hover:bg-white/20 transition-colors">
                        <img src="assets/images/logo2.png" class="w-full h-full object-cover rounded-md group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <span class="text-slate-300 group-hover:text-white font-bold text-sm tracking-wide text-left relative z-10 transition-colors">รายการเอกสาร</span>
                </button>
                
            </div>
            
            <!-- ปุ่มออกจากระบบ -->
            <div class="p-5 border-t border-white/5 bg-[#0f172a]/50">
                <button onclick="logoutUser()" class="w-full flex items-center justify-center gap-2 py-3 rounded-xl bg-rose-500/10 hover:bg-rose-500 border border-rose-500/20 hover:border-rose-500 text-rose-400 hover:text-white text-sm font-bold transition-all duration-300 shadow-lg group">
                    <svg class="w-5 h-5 group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                    ออกจากระบบ
                </button>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- พื้นที่แสดงข้อมูลหลัก (Grid) -->
        <!-- ========================================== -->
        <div class="flex-1 p-6 md:p-10 h-screen overflow-y-auto custom-scrollbar relative">
            
            <div class="max-w-5xl mx-auto w-full mb-8">
                <h2 id="dashboard-header-title" class="text-2xl md:text-3xl font-extrabold tracking-wide text-center md:text-left drop-shadow-lg">
                    <span class='text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400'>เลือกระบบที่ต้องการดำเนินการ</span>
                </h2>
                <div class="h-1 w-20 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full mt-3 mx-auto md:mx-0"></div>
            </div>

            <div id="dashboard-grid"></div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- หน้า 2: แบบฟอร์มตรวจสอบ (Verification) -->
    <!-- ========================================== -->
    <div id="state-verification" class="hidden min-h-screen w-full flex-col items-center justify-center bg-[url('assets/images/logo3.png')] bg-cover bg-center bg-no-repeat bg-fixed relative">
        
        <div class="absolute inset-0 bg-slate-950/70 backdrop-blur-[8px] z-0"></div>

        <button class="fixed top-6 left-6 z-50 flex items-center gap-2 px-4 py-2 bg-slate-800/80 backdrop-blur-md border border-slate-600 hover:bg-[#0F767D] hover:border-[#0F767D] text-white text-sm font-semibold rounded-lg transition-all shadow-lg" onclick="goToDashboard()">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            กลับหน้าหลัก
        </button>

        <div class="relative w-full max-w-[500px] z-10 px-4 fade-in">
            <div class="bg-white rounded-xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] overflow-hidden py-10 px-8 sm:px-10">
                <div class="flex flex-col items-center justify-center gap-3 mb-8 pb-6 border-b border-slate-100">
                    <img id="verify-logo" src="assets/images/logopk.png" alt="Logo" class="h-24 w-24 object-cover rounded-xl drop-shadow-sm mb-2">
                    <h1 class="text-2xl font-bold text-[#0052CC] tracking-wide text-center uppercase" id="form-title">AI SMART CONTRACT</h1>
                </div>

                <form id="verification-form" class="space-y-7">
                    <div>
                        <label class="block text-[15px] text-slate-800 mb-2 font-medium">รหัสร้านค้า:</label>
                        <input type="text" id="shop-id" required placeholder="" 
                               class="w-full px-4 py-3.5 rounded border border-slate-300 focus:ring-2 focus:ring-[#0F767D]/50 focus:border-[#0F767D] transition-colors bg-white outline-none text-slate-700 text-base shadow-sm">
                    </div>

                    <div>
                        <label class="block text-[15px] text-slate-800 mb-2 font-medium">Slip:</label>
                        <div id="drop-zone" tabindex="0" class="mt-1 flex flex-col items-center justify-center min-h-[200px] p-2 bg-white border-2 border-dashed border-slate-300 rounded-lg transition-all focus:outline-none focus:ring-2 focus:ring-[#0F767D]/50 relative">
                            <div id="drop-zone-content" class="text-center w-full py-8">
                                <span class="text-slate-600 text-base font-medium block">วางรูปภาพที่คัดลอกวางที่นี่</span>
                                <span class="text-slate-400 text-sm block mt-1.5">(กด Ctrl+V เพื่อวางรูปภาพ)</span>
                            </div>
                            <img id="form-preview-image" src="" alt="Preview" class="hidden max-h-56 object-contain rounded shadow-sm border border-slate-200">
                            <input id="file-upload" name="file-upload" type="file" class="sr-only" accept="image/*" required>
                        </div>
                    </div>

                    <div class="pt-6 flex justify-center">
                        <button type="submit" id="submit-btn" class="px-14 py-3 rounded bg-[#006A60] hover:bg-[#00554D] text-white text-[15px] font-medium transition-all shadow-md active:scale-95 tracking-wide">
                            ตรวจสอบ
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ป๊อปอัป: กำลังโหลด (Loading) -->
    <!-- ========================================== -->
    <div id="loading-overlay" class="hidden fixed inset-0 z-[70] flex items-center justify-center bg-black/70 backdrop-blur-sm fade-in px-4">
        <div class="bg-[#0A0A0A] border border-slate-800 rounded-xl p-6 w-full max-w-[280px] flex flex-col items-center shadow-2xl pop-up">
            <h3 class="text-white font-medium mb-5 flex items-center gap-2 text-sm">
                <svg class="animate-spin h-5 w-5 text-[#0052CC]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                ระบบกำลังประมวลผล...
            </h3>
            <div class="w-full bg-slate-800 rounded-full h-2 mb-1.5 overflow-hidden shadow-inner">
                <div id="progress-bar" class="bg-gradient-to-r from-[#0052CC] to-[#0F767D] h-2 rounded-full transition-all duration-300 relative" style="width: 0%">
                    <div class="absolute inset-0 bg-white/20 animate-pulse"></div>
                </div>
            </div>
            <p class="text-slate-400 text-[11px] w-full text-right font-mono" id="progress-text">0%</p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ป๊อปอัป: แสดงผลลัพธ์ (Result) -->
    <!-- ========================================== -->
    <div id="result-overlay" class="hidden fixed inset-0 z-[70] flex items-center justify-center bg-black/60 backdrop-blur-sm px-4 fade-in">
        <!-- เปลี่ยนจาก max-w-[420px] เป็น max-w-[500px] -->
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-[500px] p-8 sm:p-10 flex flex-col items-center pop-up">
            <div class="flex flex-col items-center justify-center gap-2 mb-8">
                <img id="result-form-logo" src="assets/images/logopk.png" alt="Logo" class="h-20 w-20 object-cover rounded-xl shadow-sm mb-2">
                <h1 class="text-xl font-bold text-[#0052CC] tracking-wide uppercase" id="result-head-title">PREMIUM KIDS</h1>
            </div>
            
            <h2 id="result-title" class="text-xl font-bold mb-4">ผลการตรวจสอบรหัสสำคัญ</h2>
            <p class="text-base text-slate-800 font-medium mb-6">รหัสร้านค้า: <span id="result-shop-id" class="font-normal text-slate-700"></span></p>

            <div class="w-full border border-slate-200 rounded p-2 mb-6 bg-white shadow-inner">
                <!-- ขยายความสูงกล่องแสดงรูป (h-72) -->
                <div class="w-full h-72 bg-slate-50 flex items-center justify-center overflow-hidden rounded-sm relative">
                    <img id="result-image" src="" alt="Verified Slip" class="max-w-full max-h-full object-contain">
                </div>
            </div>

            <div id="result-message-box" class="w-full text-center leading-relaxed text-[15px]"></div>
            
            <button onclick="closeResult()" class="mt-8 text-slate-400 hover:text-slate-600 text-sm font-medium underline underline-offset-4 transition-colors">
                คลิกเพื่อปิด / ตรวจสอบรายการใหม่
            </button>
        </div>
    </div>

    <!-- Script Loads -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script> 
    <script src="js/app.js"></script> 

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>

</body>
</html>
